# List of project cards. Add or edit each entry freely.
- name: "Axion-like Particle Search"
  description: "If axion-like particles exist, TeV spectra of extragalactic sources will be oscillated or harden. I have analysed TeV data of extragalactic blazars with HAWC to search this ALP signature."
  url: "https://pos.sissa.it/501/538/pdf"

- name: "Galactic TeV source analysis"
  description: "I have analysed several Galactic gamma-ray sources with HAWC (J1844-034, SS 433, and G32.64+0.53), and tested plausible scenarios of the multiwavelength emissions."
  url: "https://arxiv.org/abs/2603.19721"

- name: "Deep learning for Astrophysics"
  description: "I have worked for implementing deep-learning based reconstructor for SWGO. It leverages all the low-level PMT information to maximize the input information for the reconstruction task."
  url: "https://arxiv.org/abs/2604.09402"
