[workspace]
authors = ["Youngwan Son <youngwan.son@cern.ch>"]
channels = ["conda-forge"]
name = "virusfunk.github.io"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
# Install gem dependencies (isolated inside the project at vendor/bundle)
install = "bundle config set --local path 'vendor/bundle' && bundle install"
# Local preview server (http://localhost:4000) with live reload
serve = "bundle exec jekyll serve --livereload --host 0.0.0.0"
# Static build for deployment (generates _site)
build = "bundle exec jekyll build"
# Clean _site and caches
clean = "bundle exec jekyll clean"

[dependencies]
ruby = "3.3.*"
c-compiler = "*"
cxx-compiler = "*"
make = "*"
pkg-config = "*"
